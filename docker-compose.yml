# Ballast on Unraid: one app container, one Postgres container (PRD §10).
#
# For a first look on a laptop, use docker-compose.quickstart.yml instead --
# same image, same bootstrap, friendlier defaults. This file is the production
# one: it expects the Unraid array and a real hostname.
#
# The app connects as ballast_app, a role that cannot UPDATE or DELETE events.
# Migrations run as the owner. Handing the app the owner's credentials would
# quietly undo the append-only guarantee, so the two URLs stay separate.
#
# On start the container migrates, sets the restricted role's password from
# APP_DB_PASSWORD, and seeds the household -- all idempotent. There are no
# manual first-run steps.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ballast}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: ${POSTGRES_DB:-ballast}
      TZ: America/Chicago
    volumes:
      # On Unraid, point this at the array rather than a docker volume.
      - ${DATA_DIR:-./pgdata}:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ballast} -d ${POSTGRES_DB:-ballast}']
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published to the LAN: only the app container needs it.
    expose:
      - '5432'

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://ballast_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:-ballast}"
      DATABASE_MIGRATION_URL: "postgres://${POSTGRES_USER:-ballast}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ballast}"
      AUTH_SECRET: "${AUTH_SECRET:?generate one by running openssl rand -base64 32}"
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:?}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:?}
      AUTH_URL: "${AUTH_URL:?the URL the PWA is opened at, for example https://ballast.example.ts.net}"
      APP_DB_PASSWORD: "${APP_DB_PASSWORD}"
      AUTH_TRUST_HOST: 'true'
      # Nobody can sign in unless their address is on this list.
      SEED_ALLOWED_EMAILS: "${SEED_ALLOWED_EMAILS:?the email addresses allowed to sign in, comma separated}"
      SEED_HOUSEHOLD_NAME: ${SEED_HOUSEHOLD_NAME:-Household}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
      N8N_WEBHOOK_TOKEN: ${N8N_WEBHOOK_TOKEN:-}
      HOUSEHOLD_TIMEZONE: ${HOUSEHOLD_TIMEZONE:-America/Chicago}
      TZ: America/Chicago
    ports:
      - '${APP_PORT:-3000}:3000'
