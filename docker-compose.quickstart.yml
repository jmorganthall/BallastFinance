# Ballast — quick start.
#
#   ./scripts/quickstart.sh          generates .env, then brings this up
#
# or, if you have already written a .env:
#
#   docker compose -f docker-compose.quickstart.yml up -d --build
#
# The difference from docker-compose.yml is only in the defaults, not the
# architecture: this one uses a Docker-managed volume and localhost, while the
# production file expects the Unraid array and a real hostname. Both run the
# same image, the same bootstrap, and the same two database roles.
#
# The app still never touches a bank. Nothing here asks for a bank credential,
# and nothing here can move money.

name: ballast

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-ballast}"
      # Not exposed to the network, but still not left blank.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?run ./scripts/quickstart.sh, or set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: "${POSTGRES_DB:-ballast}"
      TZ: "${HOUSEHOLD_TIMEZONE:-America/Chicago}"
    volumes:
      - ballast-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ballast} -d ${POSTGRES_DB:-ballast}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    # Deliberately not published: only the app container needs the database.
    expose:
      - '5432'

  app:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Two roles on purpose. The app connects as ballast_app, which cannot
      # UPDATE or DELETE events; migrations run as the owner. Pointing both at
      # the owner would silently undo the append-only guarantee that makes every
      # balance in the app falsifiable.
      DATABASE_URL: "postgres://ballast_app:${APP_DB_PASSWORD:?run ./scripts/quickstart.sh, or set APP_DB_PASSWORD in .env}@db:5432/${POSTGRES_DB:-ballast}"
      DATABASE_MIGRATION_URL: "postgres://${POSTGRES_USER:-ballast}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ballast}"
      APP_DB_PASSWORD: "${APP_DB_PASSWORD}"

      # Sign-in. Google is the only configured provider; these come from a
      # Google Cloud OAuth client. There is no way around them: the app has no
      # password login by design.
      AUTH_SECRET: "${AUTH_SECRET:?run ./scripts/quickstart.sh, or generate one by running openssl rand -base64 32}"
      AUTH_GOOGLE_ID: "${AUTH_GOOGLE_ID:?create a Google OAuth client and set AUTH_GOOGLE_ID}"
      AUTH_GOOGLE_SECRET: "${AUTH_GOOGLE_SECRET:?create a Google OAuth client and set AUTH_GOOGLE_SECRET}"
      AUTH_URL: "${AUTH_URL:-http://localhost:3000}"
      AUTH_TRUST_HOST: 'true'

      # Nobody can sign in unless their email is on this list.
      SEED_ALLOWED_EMAILS: "${SEED_ALLOWED_EMAILS:?the email addresses allowed to sign in, comma separated}"
      SEED_HOUSEHOLD_NAME: "${SEED_HOUSEHOLD_NAME:-Household}"

      # Optional: the app computes, n8n delivers. Leave unset and notifications
      # are logged and dropped rather than failing anything.
      N8N_WEBHOOK_URL: "${N8N_WEBHOOK_URL:-}"
      N8N_WEBHOOK_TOKEN: "${N8N_WEBHOOK_TOKEN:-}"

      HOUSEHOLD_TIMEZONE: "${HOUSEHOLD_TIMEZONE:-America/Chicago}"
      TZ: "${HOUSEHOLD_TIMEZONE:-America/Chicago}"
    ports:
      - '${APP_PORT:-3000}:3000'

volumes:
  ballast-data:
