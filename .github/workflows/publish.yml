name: Publish image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A published image that was never tested is worse than no image: people pull
  # it and trust it. Publishing waits for the full suite.
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build and push to GHCR
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write # required for GITHUB_TOKEN to push to ghcr.io
      attestations: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Lowercase: ghcr.io rejects uppercase in an image name, and the
          # repository name is mixed case.
          images: ghcr.io/${{ github.repository_owner }}/ballastfinance
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Ballast Finance
            org.opencontainers.image.description=Self-hosted family reservation engine. Never moves money, holds no bank credentials.
            org.opencontainers.image.licenses=${{ github.event.repository.license.spdx_id }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 covers Raspberry Pi and Apple Silicon; it is emulated here, so
          # it is the slow half of this job. The registry cache makes repeat
          # builds bearable.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/ballastfinance
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Summary
        run: |
          {
            echo "### Pushed"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Digest: \`${{ steps.push.outputs.digest }}\`"
            echo
            echo "New packages are **private** by default. Make it public once, under"
            echo "Packages → ballastfinance → Package settings → Change visibility."
          } >> "$GITHUB_STEP_SUMMARY"
